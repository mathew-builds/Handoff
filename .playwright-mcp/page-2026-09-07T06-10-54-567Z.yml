                    - code [ref=f126e1412]: title
                    - text: followed by the title text.
                  - paragraph [ref=f126e1413]: Then you add the timeline data, where you always start with a time period, followed by a colon and then the text for the event. Optionally you can add a second colon and then the text for the event. So, you can have one or more events per time period.
