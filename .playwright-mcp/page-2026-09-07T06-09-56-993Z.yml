                    - text: if you want to know where to start helping out.
                  - paragraph [ref=f101e1227]:
                    - text: Detailed information about how to contribute can be found in the
                    - link "contribution guide" [ref=f101e1228] [cursor=pointer]:
                      - /url: https://mermaid.js.org/community/contributing.html
                  - generic [ref=f101e1229]:
                    - heading "Security and safe diagrams" [level=2] [ref=f101e1230]
                    - 'link "Permalink: Security and safe diagrams" [ref=f101e1231] [cursor=pointer]':
                      - /url: "#security-and-safe-diagrams"
                  - paragraph [ref=f101e1234]: For public sites, it can be precarious to retrieve text from users on the internet, storing that content for presentation in a browser at a later stage. The reason is that the user content can contain embedded malicious scripts that will run when the data is presented. For Mermaid this is a risk, specially as mermaid diagrams contain many characters that are used in html which makes the standard sanitation unusable as it also breaks the diagrams. We still make an effort to sanitize the incoming code and keep refining the process but it is hard to guarantee that there are no loop holes.
                  - paragraph [ref=f101e1235]: As an extra level of security for sites with external users we are happy to introduce a new security level in which the diagram is rendered in a sandboxed iframe preventing javascript in the code from being executed. This is a great step forward for better security.
                  - paragraph [ref=f101e1236]:
                    - emphasis [ref=f101e1237]: Unfortunately you cannot have a cake and eat it at the same time which in this case means that some of the interactive functionality gets blocked along with the possible malicious code.
                  - generic [ref=f101e1238]:
                    - heading "Reporting vulnerabilities" [level=2] [ref=f101e1239]
                    - 'link "Permalink: Reporting vulnerabilities" [ref=f101e1240] [cursor=pointer]':
                      - /url: "#reporting-vulnerabilities"
                  - paragraph [ref=f101e1243]:
                    - text: To report a vulnerability, please e-mail
                    - link "security@mermaid.live" [ref=f101e1244] [cursor=pointer]:
                      - /url: mailto:security@mermaid.live
                    - text: with a description of the issue, the steps you took to create the issue, affected versions, and if known, mitigations for the issue.
                  - generic [ref=f101e1245]:
                    - heading "Appreciation" [level=2] [ref=f101e1246]
                    - 'link "Permalink: Appreciation" [ref=f101e1247] [cursor=pointer]':
