                  - list [ref=f101e869]:
                    - listitem [ref=f101e870]:
                      - strong [ref=f101e871]: 20+ Diagram Types
                      - text: – Flowchart, Sequence, Class, State, ER, Gantt, Pie, Git Graph, Mindmap, Timeline, Sankey, and more
                    - listitem [ref=f101e872]:
                      - strong [ref=f101e873]: Markdown-Inspired Syntax
                      - text: – Write diagrams as text, no drag-and-drop required
                    - listitem [ref=f101e874]:
                      - strong [ref=f101e875]: No Design Tool Needed
                      - text: – Generate professional diagrams straight from code
                    - listitem [ref=f101e876]:
                      - strong [ref=f101e877]: Live Editor
                      - text: – Prototype instantly at
                      - link "mermaid.live" [ref=f101e878] [cursor=pointer]:
                        - /url: https://mermaid.live
                    - listitem [ref=f101e879]:
                      - strong [ref=f101e880]: Version-Control Friendly
                      - text: – Diagrams live as text, so diffs and reviews just work
                    - listitem [ref=f101e881]:
                      - strong [ref=f101e882]: Native GitHub Rendering
                      - text: – Mermaid code blocks render directly in Markdown on GitHub
                    - listitem [ref=f101e883]:
                      - strong [ref=f101e884]: Highly Customizable
                      - text: – Themes, colors, fonts, and layout directions
                    - listitem [ref=f101e885]:
