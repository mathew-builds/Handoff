                  - paragraph [ref=f101e1225]:
                    - text: Mermaid is a growing community and is always accepting new contributors. There's a lot of different ways to help out and we're always looking for extra hands! Look at
                    - link "this issue" [ref=f101e1226] [cursor=pointer]:
