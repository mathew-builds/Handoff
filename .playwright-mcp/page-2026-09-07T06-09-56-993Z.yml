                      - text: – Built-in sanitization plus a sandboxed rendering mode
                    - listitem [ref=f101e887]:
                      - strong [ref=f101e888]: Lightweight
                      - text: – Small footprint, no heavy dependencies
                    - listitem [ref=f101e889]:
                      - strong [ref=f101e890]: Active Community
