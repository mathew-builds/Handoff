                      - /url: "#about"
                  - paragraph [ref=f101e842]: Mermaid is a JavaScript-based diagramming and charting tool that uses Markdown-inspired text definitions and a renderer to create and modify complex diagrams. The main purpose of Mermaid is to help documentation catch up with development.
                  - blockquote [ref=f101e843]:
                    - paragraph [ref=f101e844]: Doc-Rot is a Catch-22 that Mermaid helps to solve.
                  - paragraph [ref=f101e845]: Diagramming and documentation costs precious developer time and gets outdated quickly. But not having diagrams or docs ruins productivity and hurts organizational learning. Mermaid addresses this problem by enabling users to create easily modifiable diagrams. It can also be made part of production scripts (and other pieces of code).
                  - paragraph [ref=f101e846]:
                    - text: Mermaid allows even non-programmers to easily create detailed diagrams through the
                    - link "Mermaid Live Editor" [ref=f101e847] [cursor=pointer]:
                      - /url: https://mermaid.live/
                    - text: . For video tutorials, visit our
                    - link "Tutorials" [ref=f101e848] [cursor=pointer]:
                      - /url: https://mermaid.js.org/ecosystem/tutorials.html
                    - text: page. Use Mermaid with your favorite applications, check out the list of
                    - link "Integrations and Usages of Mermaid" [ref=f101e849] [cursor=pointer]:
                      - /url: https://mermaid.js.org/ecosystem/integrations-community.html
                    - text: .
                  - paragraph [ref=f101e850]:
                    - text: You can also use Mermaid within
                    - link "GitHub" [ref=f101e851] [cursor=pointer]:
                      - /url: https://github.blog/2022-02-14-include-diagrams-markdown-files-mermaid/
                    - text: as well many of your other favorite applications—check out the list of
                    - link "Integrations and Usages of Mermaid" [ref=f101e852] [cursor=pointer]:
                      - /url: https://mermaid.js.org/ecosystem/integrations-community.html
                    - text: .
                  - paragraph [ref=f101e853]:
                    - text: For a more detailed introduction to Mermaid and some of its more basic uses, look to the
                    - link "Beginner's Guide" [ref=f101e854] [cursor=pointer]:
                      - /url: https://mermaid.js.org/intro/getting-started.html
                    - text: ","
                    - link "Usage" [ref=f101e855] [cursor=pointer]:
                      - /url: https://mermaid.js.org/config/usage.html
                    - text: and
                    - link "Tutorials" [ref=f101e856] [cursor=pointer]:
                      - /url: https://mermaid.js.org/ecosystem/tutorials.html
                    - text: .
                  - paragraph [ref=f101e857]:
                    - text: Our PR Visual Regression Testing is powered by
                    - link "Argos" [ref=f101e858] [cursor=pointer]:
                      - /url: https://argos-ci.com/?utm_source=mermaid&utm_campaign=oss
                    - text: with their generous Open Source plan. It makes the process of reviewing PRs with visual changes a breeze.
                  - paragraph [ref=f101e859]:
                    - link [ref=f101e860] [cursor=pointer]:
                      - /url: https://argos-ci.com?utm_source=mermaid&utm_campaign=oss
                      - img "Covered by Argos Visual Testing" [ref=f101e861]
                  - paragraph [ref=f101e862]:
                    - text: In our release process we rely heavily on visual regression tests using
                    - link "applitools" [ref=f101e863] [cursor=pointer]:
                      - /url: https://applitools.com/
                    - text: . Applitools is a great service which has been easy to use and integrate with our tests.
