<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Handoff — no server, no tunnel, no second meter">
  <title>Handoff</title>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E8A33D" stop-opacity="0.50"/>
      <stop offset="45%"  stop-color="#E8A33D" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E8A33D" stop-opacity="0"/>
      <stop offset="65%"  stop-color="#E8A33D" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="ground" cx="50%" cy="38%" r="72%">
      <stop offset="0%"   stop-color="#171B21"/>
      <stop offset="100%" stop-color="#0F1216"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#ground)"/>

  <!-- the pass, centred above the type -->
  <rect x="356" y="196" width="76" height="76" rx="22"
        fill="none" stroke="#8A6B33" stroke-width="3"/>
  <circle cx="700" cy="234" r="210" fill="url(#glow)"/>
  <rect x="460" y="230" width="240" height="7" rx="3.5" fill="url(#trail)"/>
  <g transform="translate(700 234) rotate(45)">
    <rect x="-18" y="-18" width="36" height="36" rx="9" fill="#F6D9A6"/>
    <rect x="-10" y="-10" width="20" height="20" rx="5" fill="#FFFFFF"/>
  </g>
  <rect x="848" y="196" width="76" height="76" rx="22"
        fill="none" stroke="#B8863C" stroke-width="3"/>

  <!-- wordmark, centred -->
  <text x="640" y="440" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="118" font-weight="500" letter-spacing="3"
        fill="#F2EFE9">Handoff</text>

  <text x="640" y="496" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="31" font-weight="400" letter-spacing="1.2"
        fill="#98A0AA">No server. No tunnel. No second meter.</text>

  <text x="640" y="556" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="23" font-weight="400" letter-spacing="0.5"
        fill="#6B7480">Delegate coding from your chat agent to your coding agent, over GitHub.</text>
</svg>
