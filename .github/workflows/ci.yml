# CI for the bridge repo itself.
#
# This project tells consumers to gate everything on tests, then for a while
# shipped an unlinted template with no checks of its own (issue #24). PR #20
# merged with zero checks. This is the fix.
#
# Every step here must exit non-zero on failure. A check that reports instead of
# failing reads as a pass, which is issue #36 — do not add `|| true` to anything.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on a PR branch — you don't need CI on a commit you
# have already pushed past. But NEVER cancel on main: every commit that lands
# there deserves a completed verdict, and a cancelled run looks identical to a
# failed one in the Actions tab. Two merges five seconds apart on 2026-09-05
# cancelled the first one's CI and it read as a broken build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint --version

      - name: Lint every workflow, including the templates consumers copy
        run: |
          set -euo pipefail
          # The templates are the product. Lint them at a real workflow path so
          # actionlint's event- and context-sensitive rules actually run.
          #
          # The one suppression: actionlint 1.7.12 does not know the `queue` key
          # under `concurrency`. GitHub documents it (`single` default, `max` for
          # up to 100 pending) and we confirmed it parses on real GitHub — run
          # 33971250162 on a private trial repo succeeded with `queue: max` in the
          # file. Checked 2026-09-05; drop this flag once actionlint catches up.
          IGNORE='unexpected key "queue" for "concurrency" section'
          mkdir -p .lintcheck/.github/workflows
          cp templates/*.yml .lintcheck/.github/workflows/
          ./actionlint -ignore "$IGNORE" .github/workflows/*.yml
          (cd .lintcheck && ../actionlint -ignore "$IGNORE" .github/workflows/*.yml)

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Every relative link in the docs must resolve
        run: python3 scripts/check-links.py

      - name: The consumer workflow must keep its three cost brakes
        run: python3 scripts/check-workflow-caps.py

      - name: The operator scripts must lint AND run
        # Nothing checked scripts/ at all until 2026-09-06, which is how a change
        # that made setup.sh exit 1 on a correctly configured repo reached main.
        # `bash -n` and shellcheck both passed on that file — only executing it,
        # against the input it should accept, caught it. Hence: run, don't read.
        run: bash scripts/test-scripts.sh

      - name: No secrets committed
        run: |
          set -euo pipefail
          # Cheap, specific tripwire for the two credential shapes this project
          # handles. Not a substitute for secret scanning.
          if grep -rInE 'sk-ant-[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{36}' \
               --exclude-dir=.git --exclude-dir=.lintcheck . ; then
            echo "::error::A credential-shaped string is committed. Remove it and rotate the credential."
            exit 1
          fi
          echo "no credential-shaped strings found"
