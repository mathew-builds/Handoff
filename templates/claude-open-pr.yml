# grokbot-claude-bridge — companion workflow: open the pull request
# Copy to .github/workflows/claude-open-pr.yml alongside claude.yml.
#
# WHY THIS EXISTS
# The Claude Code action does not open pull requests in tag mode. It pushes a
# branch and posts a "Create PR" link for a human to click. That leaves a manual
# step in the middle of a loop that is supposed to be unattended, and it means
# the `pull_request opened` event never fires — so the Grok Bot return-path
# routine (TASKS 1.5) has nothing to listen for.
#
# This workflow closes that gap with a plain GitHub feature and zero model turns.
# See docs/02-decisions.md D12 and issue #41.
#
# KNOWN LIMITATION, read before relying on it
# A pull request opened with the default GITHUB_TOKEN does NOT start further
# GitHub Actions workflow runs, so your own CI will not run on the PR. Webhooks
# and API events DO still fire, which is what the return-path routine needs.
# If you need CI on these PRs, pass a GitHub App token or a PAT as GH_TOKEN
# instead — and accept that you are then storing another credential.
# Claude runs your tests inside its own turn regardless (see CLAUDE.md.template).

name: Open PR for Claude branches

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read
  pull-requests: write

# One attempt per branch. A second push while the first is opening should wait,
# not race it into a duplicate pull request.
concurrency:
  group: claude-open-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Open a pull request if one is not already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Idempotent: Claude pushes more than once per task when it iterates.
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "A pull request is already open for $BRANCH. Nothing to do."
            exit 0
          fi

          git fetch --quiet origin "$BASE"
          ahead="$(git rev-list --count "origin/$BASE..HEAD")"
          if [ "$ahead" = "0" ]; then
            echo "$BRANCH has no commits ahead of $BASE. Nothing to open."
            exit 0
          fi

          # Claude names branches claude/issue-<n>-<timestamp>. Recover the
          # issue number so the PR closes it; tolerate any other branch shape.
          issue="$(printf '%s' "$BRANCH" | sed -n 's|^claude/issue-\([0-9][0-9]*\)-.*|\1|p')"

          # Take the last NON-MERGE commit in the range. If the branch has been
          # refreshed from the base, the tip is a merge commit whose subject is
          # "Merge remote-tracking branch ..." and whose body is empty — which is
          # exactly the useless PR title we shipped on the first real run.
          range="origin/$BASE..HEAD"
          title="$(git log --no-merges -1 --pretty=%s "$range")"
          [ -n "$title" ] || title="Claude: changes on $BRANCH"

          # Built with printf rather than a heredoc: heredoc bodies must start at
          # column 0, which would break out of this YAML block scalar.
          {
            # Trailers belong on the commit, not in the PR body. sed always
            # exits 0, so this is safe under `set -e`; grep -v would not be.
            git log --no-merges -1 --pretty=%b "$range" \
              | sed -E '/^(Co-authored-by|Signed-off-by|Claude-Session|Co-Authored-By):/d'
            printf '\n---\n\n'
            printf 'Opened automatically from %s, %s commit(s) ahead of %s.\n' \
              "$BRANCH" "$ahead" "$BASE"
            printf 'The Claude Code action pushes a branch but does not open the pull request itself.\n'
            if [ -n "$issue" ]; then
              printf '\nCloses #%s\n' "$issue"
            fi
          } > /tmp/pr-body.md

          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "$title" \
            --body-file /tmp/pr-body.md

          echo "Opened a pull request for $BRANCH."
