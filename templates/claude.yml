# Handoff — consumer repo workflow
# Copy to .github/workflows/claude.yml in the repo Claude should work on.
# Verify inputs against https://code.claude.com/docs/en/github-actions before editing.
#
# Triggers, the `if:` expression and the permissions block below are kept
# identical to the upstream reference file so this template tracks it:
# https://github.com/anthropics/claude-code-action/blob/main/examples/claude.yml
# Last verified against upstream and the official docs: 2026-09-05 (see D10).

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    # `assigned` is upstream's default. It starts a runner but never starts
    # Claude: the action only reads an issue body/title for the trigger phrase
    # on `opened`, and on `assigned` it needs the `assignee_trigger` input,
    # which we do not set. Cost is Actions minutes only, never Max spend.
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One run per issue/PR at a time. `queue: max` matters: without it GitHub keeps
# only ONE pending run per group, so a third @claude on the same thread silently
# cancels the second before it starts.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  claude:
    # Only run when @claude is actually mentioned. The action itself additionally
    # checks that the author has write access — do not remove that behaviour.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30            # hard wall-clock brake
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write     # required for the action's default GitHub App authentication
      actions: read       # required for Claude to read CI results on PRs
    steps:
      # ── Refuse an issue that was routed to the wrong repository ───────────
      # For anyone driving several repos from one chat bot. The bot has to
      # decide which project a request belongs to, and a wrong guess is
      # invisible until Claude has already edited the wrong codebase and
      # opened a pull request on it. This makes that a no-op instead.
      #
      # The contract: if the issue body has a `Repo:` line naming a repository,
      # it must be this one. **No `Repo:` line means no check**, so single-repo
      # setups are completely unaffected and this is safe to copy as-is.
      #
      # Runs before checkout and before Claude, so a misroute costs seconds of
      # Actions time and zero model turns.
      - name: Refuse a misrouted issue
        if: github.event_name == 'issues' || github.event_name == 'issue_comment'
        env:
          # Untrusted input goes through env, never inline in the script.
          BODY: ${{ github.event.issue.body }}
          THIS_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          IS_NEW_ISSUE: ${{ github.event_name == 'issues' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required, not decorative. `gh` resolves which repository to act on
          # from the checked-out git remote — and this step deliberately runs
          # BEFORE actions/checkout, so there is no remote. Without this, every
          # `gh issue comment` below fails with "fatal: not a git repository"
          # and the refusal is silent: the step still exits 1 and still blocks
          # the run, but the human never learns why. Shipped broken; the tests
          # missed it because the stub `gh` ignored its arguments.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `|| true` is required, not decorative: grep exits 1 when it matches
          # nothing, and under `set -e` the COMMON case — no Repo: line at all —
          # would kill the step. That exact bug shipped here once already.
          #
          # Decoration is tolerated in the ANCHOR, never in the captured value.
          # A bot writing `**Repo: o/r**`, a blockquoted line, a backticked one
          # or a pasted github.com URL used to slip past the old anchor — and
          # the step then logged "No 'Repo:' line — routing check does not
          # apply", reporting reassurance at the exact moment the check had been
          # defeated. The value keeps the closed [A-Za-z0-9._-] class, which is
          # what keeps issue-supplied text out of the shell.
          #
          # shellcheck disable=SC2016
          # The backticks inside the character class are literal Markdown code
          # fences we tolerate in the anchor, not command substitution. The
          # expression must stay single-quoted so the shell leaves it alone.
          LINE="$(printf '%s\n' "${BODY:-}" \
            | grep -oiE '^[[:space:]>*_`]*repo:[[:space:]*_`]*(https?://github\.com/)?[A-Za-z0-9._-]+/[A-Za-z0-9._-]+' \
            | head -1 || true)"

          if [ -z "$LINE" ]; then
            echo "No 'Repo:' line — routing check does not apply."
            exit 0
          fi

          # Drop the label, then decoration, then a link prefix, then trailing
          # punctuation. A correctly routed issue written `Repo: acme/api.` or
          # `Repo: acme/api.git` must not be refused over the full stop.
          #
          # shellcheck disable=SC2016
          # The `$` below is a sed end-of-line anchor, not a shell variable, and
          # the expressions must stay single-quoted so the shell leaves them
          # alone. Same reason as the printf block further down.
          DECLARED="$(printf '%s' "$LINE" \
            | sed -E -e 's/^[^:]*:[[:space:]]*//' \
                     -e 's/^[*_`[:space:]]+//' \
                     -e 's#^https?://github\.com/##' \
                     -e 's/[.,;:*_`[:space:]]+$//')"
          want="$(printf '%s' "$DECLARED"  | tr '[:upper:]' '[:lower:]')"
          want="${want%.git}"
          here="$(printf '%s' "$THIS_REPO" | tr '[:upper:]' '[:lower:]')"

          if [ "$want" = "$here" ]; then
            echo "Routed correctly: issue names $DECLARED, running on $THIS_REPO."
            exit 0
          fi

          echo "::error::Issue declares $DECLARED but opened on $THIS_REPO. Refusing."

          # Comment only on a NEWLY OPENED issue. On issue_comment the body we
          # read is the issue's, so commenting here would re-read the same bad
          # Repo: line on the next event and comment forever.
          #
          # The comment must NOT contain the trigger phrase. A comment carrying
          # it would start this workflow again — that is the actual loop, and
          # the events guard above is only the second line of defence.
          if [ "$IS_NEW_ISSUE" = "true" ]; then
            # shellcheck disable=SC2016
            # The backticks below are Markdown code fences in the comment body, not
            # command substitution. Values are passed as printf arguments, which is
            # also what keeps issue-supplied text out of the shell.
            {
              printf '**Not acting on this issue — it looks misrouted.**\n\n'
              printf 'It declares `Repo: %s`, but it was opened on `%s`.\n\n' "$DECLARED" "$THIS_REPO"
              printf 'Nothing here has been read or changed. Open it on `%s` instead, or fix the `Repo:` line and mention Claude again.\n\n' "$DECLARED"
              printf '_Handoff refuses rather than guesses: acting on a misrouted issue would edit the wrong codebase and open a pull request on it._\n'
            } > "$RUNNER_TEMP/misrouted.md"
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/misrouted.md"
          fi
          exit 1

      # `@v6` is deliberate and is NOT drift, even though this repo's own
      # .github/workflows/ci.yml moved to @v7 on 2026-09-07. Dependabot watches
      # .github/workflows/ only, never templates/ — the templates run in a
      # consumer's repo. This file tracks upstream's reference example, which
      # still uses @v6 (checked 2026-09-07 against
      # anthropics/claude-code-action/examples/claude.yml; actions/checkout
      # v7.0.1 exists, upstream has not adopted it). Bump this when upstream
      # does, not when our CI does.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription billing (Pro/Max/Team/Enterprise). Generate with: claude setup-token
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Do NOT pass github_token here: without it the action authenticates as the
          # Claude GitHub App, which is what lets your CI run on Claude's commits.
          #
          # Bound every run. Raise --max-turns only for a specific repo that needs it.
          # The action always includes its own base GitHub tools (read/edit/commit
          # files, read-only git, comment management), so --allowedTools only needs
          # to name the extra Bash commands this repo's tests need. Read-only git
          # (status/diff/log) is already built in — don't re-list it.
          #
          # ── READ THIS BEFORE WIDENING THE LIST ────────────────────────────────
          # Two separate traps.
          #
          # 1. A wildcard before the subcommand grants everything after it.
          #    `Bash(python *)` allows `python -c '<anything>'`. `Bash(git *)`
          #    allows `git -c core.fsmonitor=<script> ...`. Both are arbitrary
          #    code execution, which makes the whole list decorative.
          #
          # 2. On PR-triggered runs the allow-list CANNOT make this safe, however
          #    narrow you make it. This workflow triggers on comments and reviews
          #    on pull requests, and on those runs `package.json`, lockfiles and
          #    `Makefile` stay at the PR head. So `npm test` runs the PR author's
          #    scripts, and `pytest` imports the PR author's `conftest.py`.
          #    Running a repo's tests means executing that repo's code. There is
          #    no allow-list that avoids it.
          #
          #    What actually contains it: the runner is ephemeral and holds no
          #    production credentials, and only accounts with write access can
          #    trigger a run.
          #
          #    A fourth control applies ONLY IF your repository is private: then
          #    nobody outside the people you have added can put text in front of
          #    Claude at all. This template cannot know whether that is true of
          #    your repo, and nothing in the install requires it — so do not read
          #    it as a promise. **On a public repository it does not hold**, and
          #    write access is the only thing standing between a stranger's text
          #    and a run on your subscription. See docs/05-security.md.
          #
          #    If that is not enough for your repo, remove the pull-request
          #    triggers above and run issue-only.
          #
          #    Deliberately NOT in the default list: `npm ci` / `npm install`
          #    (execute PR-authored preinstall/postinstall scripts) and
          #    `npm run *` (executes any PR-authored script). Add them only if
          #    your tests genuinely cannot run without them.
          # ──────────────────────────────────────────────────────────────────────
          claude_args: >-
            --max-turns 25
            --allowedTools "Bash(npm test),Bash(pytest *),Bash(python -m pytest *),Bash(make test)"
          # Optional: pin the model instead of taking the Claude Code default.
          #   --model claude-sonnet-5

      # ── Open the pull request, because the action will not ────────────────
      # The action pushes a branch and posts a "Create PR" link; it has no
      # PR-creation tool in tag mode (D12).
      #
      # This CANNOT be a separate push-triggered workflow, which is what we
      # tried first. `actions/checkout` defaults to `persist-credentials: true`,
      # so it writes the workflow's GITHUB_TOKEN into git config — and Claude's
      # push is then authenticated with it. GitHub does not start workflow runs
      # from that token, so a `on: push` workflow never fires for Claude's
      # branches. It fires for a human's push, which is exactly why our first
      # attempt looked like it worked. See D12 and issue #61.
      #
      # Doing it here instead needs no push trigger at all: same job, same
      # runner, and `branch_name` comes straight from the action.
      - name: Open the pull request
        if: steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # Idempotent: Claude may push more than once while it iterates.
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "A pull request is already open for $BRANCH. Nothing to do."
            exit 0
          fi

          git fetch --quiet origin "$BASE" "$BRANCH"
          range="origin/$BASE..origin/$BRANCH"
          if [ "$(git rev-list --count "$range")" = "0" ]; then
            echo "$BRANCH has no commits ahead of $BASE. Nothing to open."
            exit 0
          fi

          # Last NON-merge commit: if the branch was refreshed from the base,
          # the tip is a merge commit whose subject is useless as a PR title.
          title="$(git log --no-merges -1 --pretty=%s "$range")"
          [ -n "$title" ] || title="Claude: changes on $BRANCH"

          {
            git log --no-merges -1 --pretty=%b "$range" \
              | sed -E '/^(Co-authored-by|Signed-off-by|Claude-Session):/d'
            printf '\n---\n\n'
            printf 'Opened automatically by the workflow that ran Claude.\n'
            printf 'The Claude Code action pushes a branch but cannot open the pull request itself.\n'
            if [ -n "${ISSUE:-}" ] && [ "$ISSUE" != "null" ]; then
              printf '\nCloses #%s\n' "$ISSUE"
            fi
          } > /tmp/pr-body.md

          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "$title" --body-file /tmp/pr-body.md
          echo "Opened a pull request for $BRANCH."
