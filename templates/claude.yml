# grokbot-claude-bridge — consumer repo workflow
# Copy to .github/workflows/claude.yml in the repo Claude should work on.
# Verify inputs against https://code.claude.com/docs/en/github-actions before editing.
#
# Triggers, the `if:` expression and the permissions block below are kept
# identical to the upstream reference file so this template tracks it:
# https://github.com/anthropics/claude-code-action/blob/main/examples/claude.yml
# Last verified against upstream and the official docs: 2026-09-05 (see D10).

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    # `assigned` is upstream's default. Note it costs a run: assigning an issue
    # whose body already contains @claude re-triggers Claude on the same brief.
    # To trigger on assignment alone instead, set the `assignee_trigger` input.
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One run per issue/PR at a time. A second @claude on the same thread waits.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only run when @claude is actually mentioned. The action itself additionally
    # checks that the author has write access — do not remove that behaviour.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30            # hard wall-clock brake
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write     # required for the action's default GitHub App authentication
      actions: read       # required for Claude to read CI results on PRs
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription billing (Pro/Max/Team/Enterprise). Generate with: claude setup-token
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Do NOT pass github_token here: without it the action authenticates as the
          # Claude GitHub App, which is what lets your CI run on Claude's commits.
          #
          # Bound every run. Raise --max-turns only for a specific repo that needs it.
          # The action always includes its own base GitHub tools (read/edit/commit
          # files, read-only git, comment management), so --allowedTools only needs
          # to name the extra Bash commands this repo's tests need.
          #
          # Keep each rule narrow. `Bash(python *)` would allow `python -c '<anything>'`
          # and `Bash(git *)` would allow `git -c core.fsmonitor=<script> ...` — either
          # one is arbitrary code execution, which makes the allow-list decorative.
          # Add the specific commands your repo needs; don't widen these.
          claude_args: >-
            --max-turns 25
            --allowedTools "Bash(npm ci),Bash(npm install),Bash(npm test *),Bash(npm run *),Bash(pytest *),Bash(python -m pytest *),Bash(make test *),Bash(make lint *),Bash(git status *),Bash(git diff *),Bash(git log *)"
          # Optional: pin the model instead of taking the Claude Code default.
          #   --model claude-sonnet-5
